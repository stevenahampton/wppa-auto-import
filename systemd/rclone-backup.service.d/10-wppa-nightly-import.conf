[Unit]
# Chain the WPPA incremental import onto the nightly OneDrive sync.
OnSuccess=wppa-nightly-import.service

# OneDrive's Personal Vault ("Persönlicher Tresor") auto-relocks and its
# folder ID becomes unreadable via the Graph API until unlocked interactively.
# rclone can't list it, and on any listing error it refuses to propagate
# deletions for the *whole* sync as a safety measure. Exclude the Vault so
# the rest of the sync (and its deletions) proceeds normally.
[Service]
ExecStart=
ExecStart=/usr/bin/rclone sync onedrive: /mnt/1tb/onedrive --exclude "Persönlicher Tresor/**" --log-file=/var/log/rclone-sync.log --log-level=INFO
ExecStart=/usr/bin/rclone sync /mnt/1tb/onedrive/Pictures /mnt/router_g/Media/Pictures --log-file=/var/log/rclone-sync.log --log-level=INFO
ExecStart=/usr/bin/rclone sync /mnt/1tb/onedrive/Videos /mnt/router_g/Media/Videos --log-file=/var/log/rclone-sync.log --log-level=INFO
ExecStart=/usr/bin/rclone sync /mnt/1tb/onedrive/Music /mnt/router_g/Media/Music --log-file=/var/log/rclone-sync.log --log-level=INFO
